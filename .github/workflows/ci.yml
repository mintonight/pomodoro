name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The app draws its own UI, so the tests need no display and no
      # WebKitGTK: ui.NewTester and ui.Render draw frames in memory.
      - name: Run the tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Check the formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

  # MyGo needs no cgo, so one Linux runner compiles every platform. This
  # checks the cross-compilation the release does, without packaging.
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null .

  # Every push to main that passes the tests and compiles is released: the
  # version in mygo.json decides whether it is a new one, and the tag and
  # the release follow from it. Bump "version" in mygo.json to publish; a
  # push that does not is built and tested only.
  #
  # The tag is made here rather than by hand because the release workflow
  # reads the tag: it refuses one that disagrees with mygo.json, and builds
  # the packages under it.
  tag:
    name: Tag and release
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag, and the release the dispatch starts
      actions: write # dispatching the release workflow
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so an existing tag is found.
          fetch-depth: 0

      - name: Tag the version when it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version mygo.json)"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already tagged: nothing to release"
            exit 0
          fi
          echo "tagging $GITHUB_SHA as $tag"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          # A tag pushed with GITHUB_TOKEN starts no workflow, so ask for
          # the release on it by hand.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
          echo "dispatched Release on $tag"
