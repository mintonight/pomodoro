name: Release

# Push a tag such as v0.3.0 to build every platform and attach the packages
# to a GitHub Release. The tag must match "version" in mygo.json.
#
# The workflow is also dispatched, on the tag, by the tag job of ci.yml:
# a tag pushed with the workflow's own token starts no workflow, so after a
# push to main that job makes the tag and asks for this release by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # the releases, and the uploads to them

jobs:
  # Checks the tag against mygo.json before anything is built: a tag that
  # disagrees would publish the packages under another version.
  check:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against mygo.json
        run: |
          want="v$(jq -r .version mygo.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "the tag $GITHUB_REF_NAME does not match mygo.json ($want)" >&2
            exit 1
          fi

  # The draft exists before the builds start, so that every platform uploads
  # to the same release. Running the workflow again keeps it and replaces its
  # files. The publish job at the end makes it public.
  draft:
    name: Create the draft release
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "the release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  build:
    name: ${{ matrix.name }}
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The macOS app needs a macOS runner: making the disk image does.
          - { name: macOS, os: macos-latest, platform: "darwin/universal" }
          # MyGo needs no cgo, so Linux runners also build the Windows apps.
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # mygo build makes the Windows installers with NSIS.
      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Test
        run: go test ./...

      # No frontend, so no Bun: go.mod pins the CLI as a tool. The signing
      # key makes mygo build sign the update archives and write the
      # manifests the installed apps check; without it the packages still
      # build, they just carry no update.
      - name: Build
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}"

      # The packages of the targets, into one flat directory, with the
      # architecture in every name.
      #
      # Two things need it. mygo build names a Windows installer "pomodoro
      # Setup 0.1.0.exe" for either architecture, and a disk image after the
      # app alone, so the amd64 and arm64 files of one platform would clash
      # as release assets, and GitHub would keep only the last. And every
      # Linux target writes the same install.sh, which is the point of it —
      # it installs what suits the machine it runs on — so one copy is
      # published.
      - name: Collect the packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          stage=dist
          rm -rf "$stage"
          mkdir -p "$stage"

          for dir in build/*/; do
            target="$(basename "$dir")"
            for f in "$dir"*.dmg "$dir"*" Setup "*.exe "$dir"*.deb "$dir"*.tar.gz "$dir"install.sh; do
              # install.sh is not a glob: skip it where the target has none.
              [ -f "$f" ] || continue
              name="$(basename "$f")"
              case "$name" in
                install.sh) cp -f "$f" "$stage/install.sh" ;;
                *.exe|*.dmg)
                  cp -f "$f" "$stage/${name%.*}-${target}.${name##*.}" ;;
                *) cp -f "$f" "$stage/$name" ;;
              esac
            done
          done

          count="$(find "$stage" -maxdepth 1 -type f | wc -l)"
          if [ "$count" -eq 0 ]; then
            echo "the build produced no packages" >&2
            exit 1
          fi
          echo "$count packages:"
          ls -l "$stage"

      # Straight to the release, so its assets are what the download links
      # of a README point at. --clobber lets a re-run replace them.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/*

      - name: Keep the packages as artifacts of the run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: dist/*

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
          echo "published:"
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,tagName,url,assets \
            --jq '{name, tagName, url, assets: [.assets[] | {name, size}]}'
